name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      CORE2_SCORING_CONFIG_B64: ${{ secrets.CORE2_SCORING_CONFIG_B64 }}
      CORE2_SCORING_CASES_B64: ${{ secrets.CORE2_SCORING_CASES_B64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm test` reads from `dist/`, so the build must run first.
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      # The private answer key (`private/core-2-scoring.json` and
      # `private/core-2-scoring-cases.json`) is never committed — see
      # README.md#private-scoring-material. Populate the
      # CORE2_SCORING_CONFIG_B64 / CORE2_SCORING_CASES_B64 repository secrets
      # (base64-encoded file contents) to enable this gate; until then it is
      # skipped rather than failing every run on missing local-only material.
      - name: Restore private scoring material
        if: ${{ env.CORE2_SCORING_CONFIG_B64 != '' && env.CORE2_SCORING_CASES_B64 != '' }}
        run: |
          mkdir -p private
          printf '%s' "$CORE2_SCORING_CONFIG_B64" | base64 --decode > private/core-2-scoring.json
          printf '%s' "$CORE2_SCORING_CASES_B64" | base64 --decode > private/core-2-scoring-cases.json

      - name: Verify no answer-key leaks
        if: ${{ env.CORE2_SCORING_CONFIG_B64 != '' && env.CORE2_SCORING_CASES_B64 != '' }}
        run: pnpm scoring:verify-no-leaks
